# Lightweight release workflow for the standalone codex CLI binary.
#
# This workflow is intentionally separate from rust-release.yml, which handles
# official signed releases, npm packages, installers, DotSlash, and WinGet.
# See .github/workflows/README.md for when to use each workflow.
#
# The program_name input drives transient CI-only patches so the emitted binary
# name, CLI help text, and fallback config home directory all derive from one
# value.  These patches are applied inside the CI checkout and never committed.
#
# Patched locations:
#   codex-rs/cli/Cargo.toml             [[bin]] name
#   codex-rs/cli/src/main.rs            Clap bin_name / override_usage
#   codex-rs/utils/home-dir/src/lib.rs  fallback config directory

name: codex-bin-release

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: 'Binary name, CLI help text, and default config home (~/.program_name)'
        required: false
        default: 'codex'
        type: string
      publish_release:
        description: 'Create a GitHub prerelease with built artifacts'
        required: false
        default: false
        type: boolean
      build_macos_x64:
        description: 'Build: macOS x64 (Intel)'
        required: false
        default: true
        type: boolean
      build_linux_x64:
        description: 'Build: Linux x64'
        required: false
        default: true
        type: boolean
      build_windows_x64:
        description: 'Build: Windows x64'
        required: false
        default: true
        type: boolean
      build_macos_arm64:
        description: 'Build: macOS ARM64 (Apple Silicon)'
        required: false
        default: true
        type: boolean
      build_linux_arm64:
        description: 'Build: Linux ARM64'
        required: false
        default: false
        type: boolean
      build_windows_arm64:
        description: 'Build: Windows ARM64'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Resolve target matrix from inputs ──────────────────────────────────
  configure:
    name: Configure
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Build matrix JSON
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          entries=()

          [[ "${{ inputs.build_linux_x64 }}" == "true" ]] && \
            entries+=('{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","artifact_suffix":"linux-x64"}')

          [[ "${{ inputs.build_linux_arm64 }}" == "true" ]] && \
            entries+=('{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","artifact_suffix":"linux-arm64"}')

          [[ "${{ inputs.build_macos_x64 }}" == "true" ]] && \
            entries+=('{"runner":"macos-15-intel","target":"x86_64-apple-darwin","artifact_suffix":"macos-x64"}')

          [[ "${{ inputs.build_macos_arm64 }}" == "true" ]] && \
            entries+=('{"runner":"macos-latest","target":"aarch64-apple-darwin","artifact_suffix":"macos-arm64"}')

          [[ "${{ inputs.build_windows_x64 }}" == "true" ]] && \
            entries+=('{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_suffix":"windows-x64"}')

          [[ "${{ inputs.build_windows_arm64 }}" == "true" ]] && \
            entries+=('{"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","artifact_suffix":"windows-arm64"}')

          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "::error::No build targets selected"
            exit 1
          fi

          joined="$(IFS=,; echo "${entries[*]}")"
          echo "result={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          echo "Selected ${#entries[@]} target(s)"

  # ── Build matrix ───────────────────────────────────────────────────────
  build:
    needs: configure
    name: Build - ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      PROGRAM_NAME: ${{ inputs.program_name || 'codex' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate and apply program_name patches
        shell: bash
        run: |
          set -euo pipefail
          pn="${PROGRAM_NAME}"

          if ! [[ "${pn}" =~ ^[a-zA-Z][a-zA-Z0-9_-]*$ ]]; then
            echo "::error::Invalid program_name '${pn}': must start with a letter and contain only [a-zA-Z0-9_-]"
            exit 1
          fi

          echo "::group::Patching workspace for program_name=${pn}"

          # 1. Cargo.toml [[bin]] name  →  emitted binary filename
          sed -i.bak '/^\[\[bin\]\]/{n;s/^name = ".*"/name = "'"${pn}"'"/;}' cli/Cargo.toml

          # 2. home-dir fallback  →  ~/.<program_name>
          sed -i.bak 's/p\.push("\.[^"]*");/p.push(".'"${pn}"'");/' utils/home-dir/src/lib.rs

          # 3. Clap bin_name  →  help / completion output
          sed -i.bak 's/bin_name = "[^"]*"/bin_name = "'"${pn}"'"/' cli/src/main.rs

          # 4. Clap override_usage  →  usage banner
          sed -i.bak 's|override_usage = ".*"|override_usage = "'"${pn}"' [OPTIONS] [PROMPT]\\n       '"${pn}"' [OPTIONS] <COMMAND> [ARGS]"|' cli/src/main.rs

          find . -name '*.bak' -delete
          git diff --stat || true
          echo "::endgroup::"

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}

      # ── Linux musl setup (mirrors rust-release.yml) ──────────────────

      - if: contains(matrix.target, 'linux-musl')
        name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - if: contains(matrix.target, 'linux-musl')
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: contains(matrix.target, 'linux-musl')
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.0

      - if: contains(matrix.target, 'linux-musl')
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: contains(matrix.target, 'linux-musl')
        name: Configure musl build environment
        shell: bash
        run: |
          set -euo pipefail
          # Avoid aws-lc-sys jitter entropy code path on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_var="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_var="${target_var//-/_}"
          echo "${target_var}=1" >> "$GITHUB_ENV"

          # Clear inherited flags that may include sanitizer options.
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: contains(matrix.target, 'linux-musl')
        name: Configure musl rusty_v8 artifact overrides
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 "${GITHUB_WORKSPACE}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          archive="${base_url}/librusty_v8_release_${TARGET}.a.gz"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          binding_path="${binding_dir}/src_binding_release_${TARGET}.rs"
          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/src_binding_release_${TARGET}.rs" -o "${binding_path}"
          echo "RUSTY_V8_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "$GITHUB_ENV"

      # ── Build ────────────────────────────────────────────────────────

      - name: Cargo build
        shell: bash
        run: |
          echo "::group::Building ${PROGRAM_NAME} for ${{ matrix.target }}"
          cargo build --target ${{ matrix.target }} --release --bin "${PROGRAM_NAME}"
          echo "::endgroup::"

      # ── Stage artifact ───────────────────────────────────────────────

      - name: Stage binary
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          pn="${PROGRAM_NAME}"
          target="${{ matrix.target }}"
          suffix="${{ matrix.artifact_suffix }}"

          binary_name="${pn}"
          [[ "${target}" == *windows* ]] && binary_name="${pn}.exe"

          binary_path="target/${target}/release/${binary_name}"
          if [[ ! -f "${binary_path}" ]]; then
            echo "::error::Expected binary not found at ${binary_path}"
            ls -la "target/${target}/release/" 2>/dev/null || true
            exit 1
          fi

          if [[ "${target}" == *windows* ]]; then
            artifact_file="${pn}-${suffix}.exe"
          else
            artifact_file="${pn}-${suffix}"
          fi

          mkdir -p release
          cp "${binary_path}" "release/${artifact_file}"

          echo "artifact_file=${artifact_file}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${pn}-${suffix}" >> "$GITHUB_OUTPUT"
          ls -lh "release/${artifact_file}"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: codex-rs/release/${{ steps.stage.outputs.artifact_file }}
          if-no-files-found: error

  # ── Publish prerelease ─────────────────────────────────────────────────
  publish:
    if: inputs.publish_release
    needs: build
    name: Publish prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' codex-rs/Cargo.toml \
                      | sed -E 's/version *= *"([^"]+)".*/\1/')"
          short_sha="$(git rev-parse --short=8 HEAD)"
          tag="codex-bin-v${version}-${short_sha}"
          pn="${{ inputs.program_name || 'codex' }}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "program_name=${pn}" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag} (program_name=${pn})"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Flatten artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          rm -rf dist
          cd release
          sha256sum * > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Generate release body
        env:
          PROGRAM_NAME: ${{ steps.meta.outputs.program_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pn="${PROGRAM_NAME}"
          notes="${RUNNER_TEMP}/release-body.md"
          {
            echo "## ${pn} ${VERSION} (${SHORT_SHA})"
            echo ""
            echo "Lightweight single-binary release built from \`${GITHUB_SHA}\`."
            echo ""
            echo "> **This is not an official release.** For officially signed and distributed"
            echo "> builds, see the releases published by"
            echo "> [\`rust-release.yml\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/rust-release.yml)."
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | Binary |"
            echo "|----------|--------|"
            for f in release/*; do
              [[ "$(basename "$f")" == "SHA256SUMS" ]] && continue
              base="$(basename "$f")"
              echo "| ${base} | \`${base}\` |"
            done
            echo ""
            echo "### SHA256 Checksums"
            echo ""
            echo "\`\`\`"
            cat release/SHA256SUMS
            echo "\`\`\`"
          } > "${notes}"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PROGRAM_NAME: ${{ steps.meta.outputs.program_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Idempotent: remove existing release for this tag before recreating.
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --title "${PROGRAM_NAME} ${VERSION} (${SHORT_SHA})" \
            --notes-file "${RUNNER_TEMP}/release-body.md" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            release/*
